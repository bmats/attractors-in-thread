<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaotic Embroidery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Chaotic Embroidery</h1>
        <p>
          play with strange attractors and export patterns ready for machine embroidery!
          <a href="https://github.com/bmats/attractors-in-thread" target="_blank">more info</a>
        </p>
        <p>drag to rotate, scroll to zoom</p>
      </header>
      <footer>
        credit: <a href="https://www.dynamicmath.xyz/strange-attractors/" target="_blank">Dynamic Math</a>, <a href="https://paulbourke.net/fractals/" target="_blank">Paul Bourke</a>, <a href="https://en.wikipedia.org/wiki/List_of_chaotic_maps" target="_blank">Wikipedia</a>
      </footer>
      <main class="stage">
        <div class="hoop-col">
          <div class="hoop">
            <canvas id="canvas"></canvas>
          </div>
          <button id="restart-button" title="Restart">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
        <aside class="panel" id="panel"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
